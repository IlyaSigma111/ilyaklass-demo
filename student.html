<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ИльЯкласс · ученик</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
        }
        
        body {
            background: linear-gradient(145deg, #1a3a1a, #2d6a2d, #3c8d3c);
            background-size: 300% 300%;
            animation: gradientBG 12s ease infinite;
            padding: 30px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Блик на фоне */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle at 30% 70%, rgba(255,255,255,0.25) 0%, transparent 50%);
            animation: shine 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes shine {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .container {
            width: 100%;
            max-width: 1400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 100px;
            padding: 25px 40px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2),
                        inset 0 0 30px rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Блик на хедере */
        .header::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.25) 0%, transparent 60%);
            opacity: 0.5;
            pointer-events: none;
            animation: headerShine 8s ease-in-out infinite;
        }

        @keyframes headerShine {
            0%, 100% { transform: translate(-5%, -5%) rotate(0deg); }
            50% { transform: translate(5%, 5%) rotate(5deg); }
        }
        
        .logo h1 {
            font-size: 2.4rem;
            background: linear-gradient(135deg, #fff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 2;
        }
        
        .role-badge {
            background: rgba(52, 199, 89, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: white;
            padding: 12px 40px;
            border-radius: 60px;
            font-size: 1.4rem;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2),
                        inset 0 0 20px rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .role-badge::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3) 0%, transparent 60%);
            opacity: 0.4;
            pointer-events: none;
        }
        
        .back-btn {
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .back-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .back-btn:hover::before {
            opacity: 0.5;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0 30px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.3) transparent;
        }

        .content::-webkit-scrollbar {
            width: 8px;
        }

        .content::-webkit-scrollbar-track {
            background: transparent;
        }

        .content::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .section {
            margin-bottom: 60px;
        }
        
        .section-title {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 30px;
            padding-left: 25px;
            border-left: 8px solid rgba(255, 255, 255, 0.5);
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        
        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }
        
        .quiz-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 35px 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            transition: all 0.3s ease;
            height: fit-content;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2),
                        inset 0 0 30px rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        /* Блик на карточке */
        .quiz-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.25) 0%, transparent 60%);
            opacity: 0.3;
            pointer-events: none;
            transition: opacity 0.3s;
            animation: cardShine 10s ease-in-out infinite;
        }

        @keyframes cardShine {
            0%, 100% { transform: translate(-5%, -5%) rotate(0deg); }
            50% { transform: translate(5%, 5%) rotate(3deg); }
        }
        
        .quiz-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 40px 60px rgba(0, 0, 0, 0.3),
                        inset 0 0 40px rgba(255, 255, 255, 0.25);
        }

        .quiz-card:hover::after {
            opacity: 0.6;
        }
        
        .quiz-title {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
        }
        
        .quiz-link {
            display: inline-block;
            margin: 15px 0;
            color: rgba(255, 255, 255, 0.95);
            text-decoration: none;
            font-size: 1.1rem;
            word-break: break-all;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .quiz-link:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .student-btn {
            display: inline-block;
            background: rgba(52, 199, 89, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: white;
            text-decoration: none;
            padding: 18px 30px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.2rem;
            margin-top: 20px;
            text-align: center;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2),
                        inset 0 0 20px rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .student-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .student-btn:hover {
            background: rgba(52, 199, 89, 0.4);
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.3),
                        inset 0 0 30px rgba(255, 255, 255, 0.25);
        }

        .student-btn:hover::before {
            opacity: 0.6;
        }
        
        /* Адаптивность */
        @media (max-width: 800px) {
            body { padding: 20px; }
            .header { padding: 20px 25px; }
            .logo h1 { font-size: 2rem; }
            .role-badge { font-size: 1.2rem; padding: 10px 25px; }
            .section-title { font-size: 2rem; }
            .quiz-title { font-size: 1.8rem; }
            .quiz-grid { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 500px) {
            .header { 
                flex-direction: column; 
                text-align: center; 
                border-radius: 50px;
                padding: 20px;
            }
            .back-btn { 
                width: 100%; 
                text-align: center;
            }
            .quiz-card {
                padding: 25px 20px;
            }
            .quiz-title {
                font-size: 1.6rem;
            }
        }

        /* Для iPhone и Safari */
        @supports (-webkit-touch-callout: none) {
            body {
                background-attachment: scroll;
            }
            
            .header, .quiz-card, .role-badge, .back-btn, .student-btn {
                -webkit-transform: translateZ(0);
                transform: translateZ(0);
            }
        }

        /* Защита от отбеливания на iPhone */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(145deg, #0f2a0f, #1f4a1f, #2d6a2d);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <h1>📚 ИльяКласс Демо</h1>
            </div>
            <div class="role-badge">🧑‍🎓 Ученик</div>
            <a href="index.html" class="back-btn">← На главную</a>
        </div>
        
        <div class="content">

                <div class="quiz-grid">
                    <div class="quiz-card">
                        <div class="quiz-title">🌸 8 Марта</div>
                        <div class="quiz-link">ilyasigma111.github.io/8marta-quiz/</div>
                        <a href="https://ilyasigma111.github.io/8marta-quiz/student.html" class="student-btn" target="_blank">
                            🧑‍🎓 Начать викторину

                    </div>

                    <div class="quiz-card">
                        <div class="quiz-title">🔐 Кибербезопасность</div>

                        <a href="https://ilyasigma111.github.io/cybersecurity-quiz/student.html" class="student-btn" target="_blank">

                        </a>
                    </div>

                    <div class="quiz-card">
                        <div class="quiz-title">🍌 Бананы</div>
                        <div class="quiz-link">ilyasigma111.github.io/bananasTEST/</div>
                        <a href="https://ilyasigma111.github.io/bananasTEST/student.html" class="student-btn" target="_blank">
                            🧑‍🎓 Начать викторину
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
