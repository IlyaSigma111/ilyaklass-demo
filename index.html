<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ИльЯкласс Демо · вход</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
        }
        
        body {
            background: linear-gradient(145deg, #4158D0, #C850C0, #FFCC70);
            background-size: 300% 300%;
            animation: gradientBG 10s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Блики на фоне */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 50%);
            animation: shine 15s linear infinite;
            pointer-events: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes shine {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .card {
            width: 100%;
            max-width: 1000px;
            margin: auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 80px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 90px 50px;
            text-align: center;
            color: white;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3),
                        inset 0 0 30px rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* Блик на стекле */
        .card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3) 0%, transparent 60%);
            opacity: 0.6;
            pointer-events: none;
            animation: glassShine 8s ease-in-out infinite;
        }

        @keyframes glassShine {
            0%, 100% { transform: translate(-5%, -5%) rotate(0deg); }
            50% { transform: translate(5%, 5%) rotate(5deg); }
        }

        h1 {
            font-size: clamp(3.5rem, 12vw, 6.5rem);
            margin-bottom: 30px;
            text-shadow: 0 4px 30px rgba(0,0,0,0.3);
            font-weight: 800;
            letter-spacing: -0.02em;
            position: relative;
            z-index: 2;
        }

        .subtitle {
            font-size: clamp(1.3rem, 4vw, 2rem);
            margin-bottom: 70px;
            opacity: 0.95;
            font-weight: 300;
            text-shadow: 0 2px 20px rgba(0,0,0,0.2);
            position: relative;
            z-index: 2;
        }

        .buttons {
            display: flex;
            gap: 35px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .btn {
            padding: 28px 70px;
            border-radius: 80px;
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            font-weight: 600;
            text-decoration: none;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            min-width: 320px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.05);
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        /* Блик на кнопках */
        .btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            border-color: white;
            box-shadow: 0 30px 50px rgba(0,0,0,0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn-student:hover {
            background: rgba(52, 199, 89, 0.3);
        }

        .btn-teacher:hover {
            background: rgba(0, 122, 255, 0.3);
        }

        .easter-egg {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            cursor: pointer;
            opacity: 0.2;
            transition: all 0.3s;
            z-index: 999;
        }

        .easter-egg:hover {
            opacity: 0.8;
            transform: scale(1.1);
            background: rgba(255,255,255,0.2);
        }

        .easter-egg::before {
            content: "🥚";
            font-size: 32px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .egg-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .egg-content {
            max-width: 600px;
            width: 90%;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 60px;
            padding: 50px 40px;
            text-align: center;
            color: white;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }

        .egg-content h2 {
            font-size: 2.8rem;
            margin-bottom: 25px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.3);
        }

        .egg-content p {
            font-size: 1.6rem;
            margin-bottom: 20px;
            line-height: 1.5;
            opacity: 0.9;
        }

        .egg-close {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 20px 50px;
            border-radius: 60px;
            font-size: 1.6rem;
            font-weight: 600;
            margin-top: 30px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        .egg-close:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.02);
        }

        @media (max-width: 700px) {
            .card { padding: 60px 30px; border-radius: 50px; }
            .btn { min-width: 280px; padding: 22px 40px; }
        }
        
        @media (max-width: 480px) {
            .card { padding: 40px 20px; }
            h1 { font-size: 3rem; }
            .subtitle { font-size: 1.3rem; margin-bottom: 40px; }
            .btn { min-width: 100%; }
            .easter-egg { bottom: 15px; right: 15px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📚 ИльяКласс</h1>
        <div class="subtitle">демо-версия</div>
        <div class="buttons">
            <a href="student.html" class="btn btn-student">🧑‍🎓 Ученик</a>
            <a href="teacher.html" class="btn btn-teacher">👨‍🏫 Учитель</a>
        </div>
    </div>

    <button class="easter-egg" id="easterEgg"></button>

    <div class="egg-modal" id="eggModal">
        <div class="egg-content">
            <h2>🥚 Пасхалка</h2>
            <p>ИльЯкласс Демо</p>
            <p>ilyasigma111/ilyaklass-demo</p>
            <button class="egg-close" id="closeEgg">Закрыть</button>
        </div>
    </div>

    <script>
        const eggBtn = document.getElementById('easterEgg');
        const eggModal = document.getElementById('eggModal');
        const closeBtn = document.getElementById('closeEgg');

        eggBtn.addEventListener('click', () => {
            eggModal.style.display = 'flex';
        });

        closeBtn.addEventListener('click', () => {
            eggModal.style.display = 'none';
        });

        eggModal.addEventListener('click', (e) => {
            if (e.target === eggModal) {
                eggModal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
