<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ИльЯкласс Демо · вход</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            width: 100%;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding: constant(safe-area-inset-top) constant(safe-area-inset-right) constant(safe-area-inset-bottom) constant(safe-area-inset-left);
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 900px;
            margin: auto;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 80px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 80px 40px;
            text-align: center;
            color: white;
            box-shadow: 0 40px 70px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: clamp(3rem, 12vw, 6rem);
            margin-bottom: 30px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            letter-spacing: -0.02em;
            font-weight: 800;
        }

        .subtitle {
            font-size: clamp(1.2rem, 4vw, 2rem);
            margin-bottom: 70px;
            opacity: 0.95;
            font-weight: 300;
        }

        .buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 800px;
            margin: 0 auto;
        }

        .btn {
            padding: 25px 60px;
            border-radius: 80px;
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            font-weight: 600;
            text-decoration: none;
            color: white;
            border: 4px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease;
            min-width: 280px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .btn-student {
            background: rgba(52, 199, 89, 0.2);
        }

        .btn-student:hover {
            background: #34c759;
            transform: scale(1.05);
            border-color: white;
            box-shadow: 0 30px 40px rgba(52,199,89,0.4);
        }

        .btn-teacher {
            background: rgba(0, 122, 255, 0.2);
        }

        .btn-teacher:hover {
            background: #007aff;
            transform: scale(1.05);
            border-color: white;
            box-shadow: 0 30px 40px rgba(0,122,255,0.4);
        }

        /* Пасхалка */
        .easter-egg {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: transparent;
            border: none;
            cursor: pointer;
            opacity: 0.1;
            transition: opacity 0.3s;
            z-index: 999;
        }

        .easter-egg:hover {
            opacity: 0.4;
        }

        .easter-egg::before {
            content: "🥚";
            font-size: 32px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .egg-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .egg-content {
            max-width: 600px;
            width: 90%;
            background: rgba(255,255,255,0.95);
            border-radius: 60px;
            padding: 50px 40px;
            text-align: center;
            color: #333;
        }

        .egg-content h2 {
            font-size: 2.5rem;
            margin-bottom: 25px;
            color: #667eea;
        }

        .egg-content p {
            font-size: 1.4rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .egg-close {
            background: #667eea;
            color: white;
            border: none;
            padding: 20px 50px;
            border-radius: 60px;
            font-size: 1.4rem;
            font-weight: 600;
            margin-top: 30px;
            cursor: pointer;
            width: 100%;
        }

        @media (max-width: 700px) {
            .card {
                padding: 50px 25px;
                border-radius: 50px;
            }
            .btn {
                min-width: 240px;
                padding: 20px 40px;
            }
        }
        
        @media (max-width: 480px) {
            .card {
                padding: 40px 20px;
            }
            h1 {
                font-size: 3rem;
            }
            .subtitle {
                font-size: 1.3rem;
                margin-bottom: 40px;
            }
            .btn {
                min-width: 100%;
            }
            .easter-egg {
                bottom: 15px;
                right: 15px;
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📚 ИльяКласс</h1>
        <div class="subtitle">упрощённая демо-версия</div>
        <div class="buttons">
            <a href="student.html" class="btn btn-student">🧑‍🎓 Ученик</a>
            <a href="teacher.html" class="btn btn-teacher">👨‍🏫 Учитель</a>
        </div>
    </div>

    <button class="easter-egg" id="easterEgg"></button>

    <div class="egg-modal" id="eggModal">
        <div class="egg-content">
            <h2>🥚 Пасхалка!</h2>
            <p><strong>ИльЯкласс Демо</strong></p>
            <p>ilyasigma111/ilyaklass-demo</p>
            <p>🎭 просто красивая кнопка</p>
            <button class="egg-close" id="closeEgg">Закрыть</button>
        </div>
    </div>

    <script>
        const eggBtn = document.getElementById('easterEgg');
        const eggModal = document.getElementById('eggModal');
        const closeBtn = document.getElementById('closeEgg');

        eggBtn.addEventListener('click', () => {
            eggModal.style.display = 'flex';
        });

        closeBtn.addEventListener('click', () => {
            eggModal.style.display = 'none';
        });

        eggModal.addEventListener('click', (e) => {
            if (e.target === eggModal) {
                eggModal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
