<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ИльЯкласс · ученик</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
        }
        
        body {
            background: linear-gradient(145deg, #1a2f1a, #2d5a2d);
            padding: 30px;
            padding: constant(safe-area-inset-top) constant(safe-area-inset-right) constant(safe-area-inset-bottom) constant(safe-area-inset-left);
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 1400px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 100px;
            padding: 25px 40px;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .logo h1 {
            font-size: 2.4rem;
            background: linear-gradient(135deg, #a8e6cf, #d4edfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .role-badge {
            background: #34c759;
            color: white;
            padding: 12px 40px;
            border-radius: 60px;
            font-size: 1.4rem;
            font-weight: 600;
        }
        
        .back-btn {
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 60px;
            background: rgba(255,255,255,0.1);
            font-size: 1.2rem;
            transition: 0.2s;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0 30px;
        }
        
        .section {
            margin-bottom: 60px;
        }
        
        .section-title {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 30px;
            padding-left: 25px;
            border-left: 8px solid #34c759;
        }
        
        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }
        
        .quiz-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 35px 30px;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            transition: 0.3s;
            height: fit-content;
        }
        
        .quiz-card:hover {
            transform: translateY(-5px);
            border-color: #34c759;
            background: rgba(255,255,255,0.1);
        }
        
        .quiz-title {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .quiz-link {
            display: inline-block;
            margin: 15px 0;
            color: #a8e6cf;
            text-decoration: none;
            font-size: 1.1rem;
            word-break: break-all;
            background: rgba(255,255,255,0.05);
            padding: 10px 20px;
            border-radius: 40px;
        }
        
        .student-btn {
            display: inline-block;
            background: #34c759;
            color: white;
            text-decoration: none;
            padding: 18px 30px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.2rem;
            margin-top: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            text-align: center;
            width: 100%;
            transition: 0.2s;
        }
        
        .student-btn:hover {
            background: #2db84d;
            transform: scale(1.02);
        }
        
        @media (max-width: 800px) {
            body { padding: 20px; }
            .header { padding: 20px 25px; }
            .logo h1 { font-size: 2rem; }
            .role-badge { font-size: 1.2rem; padding: 10px 25px; }
            .section-title { font-size: 2rem; }
            .quiz-title { font-size: 1.8rem; }
            .quiz-grid { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 500px) {
            .header { flex-direction: column; text-align: center; }
            .back-btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <h1>📚 ИльяКласс Демо</h1>
            </div>
            <div class="role-badge">🧑‍🎓 Ученик</div>
            <a href="index.html" class="back-btn">← На главную</a>
        </div>
        
        <div class="content">
            <div class="section">
                <h2 class="section-title">📚 Викторины</h2>
                <div class="quiz-grid">
                    <div class="quiz-card">
                        <div class="quiz-title">🌸 8 марта</div>
                        <div class="quiz-link">ilyasigma111.github.io/8marta-quiz/</div>
                        <a href="https://ilyasigma111.github.io/8marta-quiz/student.html" class="student-btn">🧑‍🎓 Начать</a>
                    </div>
                    <div class="quiz-card">
                        <div class="quiz-title">🔐 Кибербезопасность</div>
                        <div class="quiz-link">ilyasigma111.github.io/cybersecurity-quiz/</div>
                        <a href="https://ilyasigma111.github.io/cybersecurity-quiz/student.html" class="student-btn">🧑‍🎓 Начать</a>
                    </div>
                    <div class="quiz-card">
                        <div class="quiz-title">🍌 Бананы</div>
                        <div class="quiz-link">ilyasigma111.github.io/bananasTEST/</div>
                        <a href="https://ilyasigma111.github.io/bananasTEST/student.html" class="student-btn">🧑‍🎓 Начать</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
