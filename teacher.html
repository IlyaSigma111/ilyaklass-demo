<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ИльЯкласс · учитель</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
        }
        
        body {
            background: linear-gradient(145deg, #0f2027, #203a43, #2c5364);
            background-size: 300% 300%;
            animation: gradientBG 12s ease infinite;
            padding: 30px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle at 70% 30%, rgba(255,255,255,0.2) 0%, transparent 50%);
            animation: shine 18s linear infinite;
            pointer-events: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes shine {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .container {
            width: 100%;
            max-width: 1400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 100px;
            padding: 25px 40px;
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: inset 0 0 30px rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        .header::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2) 0%, transparent 60%);
            opacity: 0.5;
            pointer-events: none;
        }
        
        .logo h1 {
            font-size: 2.4rem;
            background: linear-gradient(135deg, #fff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 20px rgba(0,0,0,0.2);
        }
        
        .role-badge {
            background: rgba(0, 122, 255, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 12px 40px;
            border-radius: 60px;
            font-size: 1.4rem;
            font-weight: 600;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.2);
        }
        
        .back-btn {
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 60px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 1.2rem;
            transition: 0.3s;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0 30px;
        }
        
        .section {
            margin-bottom: 60px;
        }
        
        .section-title {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 30px;
            padding-left: 25px;
            border-left: 8px solid rgba(255,255,255,0.5);
            text-shadow: 0 2px 20px rgba(0,0,0,0.2);
        }
        
        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }
        
        .quiz-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 35px 30px;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            transition: 0.3s;
            height: fit-content;
            box-shadow: inset 0 0 30px rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        .quiz-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2) 0%, transparent 60%);
            opacity: 0.3;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .quiz-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.15);
            box-shadow: 0 30px 50px rgba(0,0,0,0.3), inset 0 0 40px rgba(255,255,255,0.2);
        }

        .quiz-card:hover::after {
            opacity: 0.6;
        }
        
        .quiz-title {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        
        .quiz-link {
            display: inline-block;
            margin: 15px 0;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            font-size: 1.1rem;
            word-break: break-all;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .teacher-btn {
            display: inline-block;
            background: rgba(0, 122, 255, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            text-decoration: none;
            padding: 18px 30px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.2rem;
            margin-top: 20px;
            text-align: center;
            width: 100%;
            transition: 0.3s;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.1);
        }
        
        .teacher-btn:hover {
            background: rgba(0, 122, 255, 0.5);
            transform: scale(1.02);
            border-color: rgba(255,255,255,0.6);
            box-shadow: 0 20px 30px rgba(0,0,0,0.2), inset 0 0 30px rgba(255,255,255,0.3);
        }
        
        @media (max-width: 800px) {
            body { padding: 20px; }
            .header { padding: 20px 25px; }
            .logo h1 { font-size: 2rem; }
            .role-badge { font-size: 1.2rem; padding: 10px 25px; }
            .section-title { font-size: 2rem; }
            .quiz-title { font-size: 1.8rem; }
            .quiz-grid { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 500px) {
            .header { flex-direction: column; text-align: center; }
            .back-btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <h1>📚 ИльяКласс Демо</h1>
            </div>
            <div class="role-badge">👨‍🏫 Учитель</div>
            <a href="index.html" class="back-btn">← На главную</a>
        </div>
        
        <div class="content">
            <div class="section">
                <h2 class="section-title">📚 Викторины</h2>
                <div class="quiz-grid">
                    <div class="quiz-card">
                        <div class="quiz-title">🌸 8 марта</div>
                        <div class="quiz-link">ilyasigma111.github.io/8marta-quiz/</div>
                        <a href="https://ilyasigma111.github.io/8marta-quiz/teacher.html" class="teacher-btn">👨‍🏫 Открыть</a>
                    </div>
                    <div class="quiz-card">
                        <div class="quiz-title">🔐 Кибербезопасность</div>
                        <div class="quiz-link">ilyasigma111.github.io/cybersecurity-quiz/</div>
                        <a href="https://ilyasigma111.github.io/cybersecurity-quiz/teacher.html" class="teacher-btn">👨‍🏫 Открыть</a>
                    </div>
                    <div class="quiz-card">
                        <div class="quiz-title">🍌 Бананы</div>
                        <div class="quiz-link">ilyasigma111.github.io/bananasTEST/</div>
                        <a href="https://ilyasigma111.github.io/bananasTEST/teacher.html" class="teacher-btn">👨‍🏫 Открыть</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
